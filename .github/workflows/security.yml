name: Security
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main, feat/ui-lab-foundation]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft - CodeQL validation deferred' || 'CodeQL scan' }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
  dependencies:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft - dependency review deferred' || 'Dependency review' }}
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The review reads both lockfiles and runs npm audit --package-lock-only;
      # it does not import application dependencies or execute install scripts.
      - name: Review added and changed lockfile dependencies
        run: node scripts/review-dependencies.mjs
        env:
          DEPENDENCY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  audit:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft - dependency audit deferred' || 'Dependency audit' }}
    # V2 has an open integration PR, which already audits each updated commit.
    # Keep the CodeQL branch scan above for its base-branch analysis database.
    if: (github.event_name != 'push' || github.ref == 'refs/heads/main') && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --package-lock-only --audit-level=high
