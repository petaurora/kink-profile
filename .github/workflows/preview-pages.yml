name: Deploy PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  issues: write
  pull-requests: write

# Only supersede older builds for the same still-open PR. gh-pages writes are
# protected by the publisher's fast-forward retry loop instead of one lossy
# cross-workflow concurrency group.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build preview
        run: npm run build
        env:
          VITE_BASE_PATH: /kink-profile/pr-${{ github.event.number }}/
          VITE_PREVIEW_PR: ${{ github.event.number }}

      - name: Publish preview
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIR: ${{ github.workspace }}/dist
          PR_NUMBER: ${{ github.event.number }}
          PUBLISH_COMMIT_MESSAGE: Deploy preview for PR #${{ github.event.number }}
        run: bash .github/scripts/publish-pages.sh preview

      - name: Add or update preview link
        if: steps.publish.outputs.published == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://petaurora.github.io/kink-profile/pr-${{ github.event.number }}/
        with:
          script: |
            const marker = "<!-- gh-pages-preview -->";
            const previewUrl = process.env.PREVIEW_URL;
            const shortSha = context.sha.slice(0, 7);
            const body = `${marker}
            ## 🌐 Preview ready!

            ### [✨ View PR #${context.issue.number} on GitHub Pages →](${previewUrl})

            | | |
            | --- | --- |
            | **Status** | ✅ Deployed |
            | **Preview path** | \`/kink-profile/pr-${context.issue.number}/\` |
            | **Installed name** | \`Kink Profile · PR ${context.issue.number}\` |
            | **Storage namespace** | \`pr-${context.issue.number}\` |
            | **Commit** | \`${shortSha}\` |

            _This same preview URL updates automatically whenever new commits are pushed to the PR._`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
