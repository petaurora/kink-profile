name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer main build supersedes an older production build, but production no
# longer shares a lossy concurrency queue with preview deploys or cleanup.
concurrency:
  group: production-pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build production site
        run: npm run build
        env:
          VITE_BASE_PATH: /kink-profile/
          VITE_BUILD_COMMIT: ${{ github.sha }}

      - name: Publish production site
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIR: ${{ github.workspace }}/dist
          PUBLISH_COMMIT_MESSAGE: Deploy production site from ${{ github.sha }}
        run: bash .github/scripts/publish-pages.sh production

  smoke:
    name: Deployed production smoke
    needs: deploy
    if: needs.deploy.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Verify hosted build and deep link
        run: npm run test:smoke
        env:
          SMOKE_BASE_URL: https://petaurora.github.io/kink-profile/
          SMOKE_EXPECTED_SHA: ${{ github.sha }}
      - name: Upload deployment smoke diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-deploy-smoke
          path: |
            smoke-report/
            smoke-results/
          retention-days: 7
