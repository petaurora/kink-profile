name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# A newer main build supersedes an older production build, but production no
# longer shares a lossy concurrency queue with preview deploys or cleanup.
concurrency:
  group: production-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build production site
        run: npm run build
        env:
          VITE_BASE_PATH: /kink-profile/

      - name: Publish production site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIR: ${{ github.workspace }}/dist
          PUBLISH_COMMIT_MESSAGE: Deploy production site from ${{ github.sha }}
        run: bash .github/scripts/publish-pages.sh production
